<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskinator | Jun Hwang</title>
    <meta name="description" content="A Kanban-style task organizer with drag and drop, saved in your browser." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/style.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="wrap topbar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">✓</span>
          <div>
            <h1>Taskinator</h1>
            <p id="summary" class="summary">No tasks yet</p>
          </div>
        </div>

        <form id="task-form" class="task-form" autocomplete="off">
          <label class="sr-only" for="task-name">Task name</label>
          <input id="task-name" name="task-name" type="text" placeholder="What needs to be done?" maxlength="80" required />
          <label class="sr-only" for="task-type">Task type</label>
          <select id="task-type" name="task-type" required>
            <option value="" disabled selected>Type</option>
            <option value="Web">Web</option>
            <option value="Mobile">Mobile</option>
            <option value="Design">Design</option>
            <option value="Print">Print</option>
          </select>
          <button id="save-task" class="btn" type="submit">Add task</button>
        </form>
      </div>
    </header>

    <main class="wrap board" id="board">
      <section class="column" data-status="to do">
        <header class="column-head">
          <h2><span class="dot todo"></span>To Do</h2>
          <span class="count" data-count="to do">0</span>
        </header>
        <ul class="task-list" id="tasks-to-do"></ul>
      </section>

      <section class="column" data-status="in progress">
        <header class="column-head">
          <h2><span class="dot progress"></span>In Progress</h2>
          <span class="count" data-count="in progress">0</span>
        </header>
        <ul class="task-list" id="tasks-in-progress"></ul>
      </section>

      <section class="column" data-status="completed">
        <header class="column-head">
          <h2><span class="dot done"></span>Completed</h2>
          <span class="count" data-count="completed">0</span>
        </header>
        <ul class="task-list" id="tasks-completed"></ul>
      </section>
    </main>

    <footer class="wrap footer">Drag cards between columns, or use the status menu. Tasks are saved in your browser.</footer>

    <script src="./assets/script.js"></script>
  </body>
</html>
